<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="725" viewBox="0 0 1000 725" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
  <title>From the discovery to a command and its state (illustration)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#46505a"/>
    </marker>
  </defs>
  <rect width="1000" height="725" fill="#ffffff"/>
  <text x="980" y="715" text-anchor="end" font-size="12" fill="#8a949e">illustration</text>
  <g font-size="15" font-weight="700" text-anchor="middle">
    <rect x="40" y="20" width="160" height="40" rx="8" fill="#f4f5f7" stroke="#8a949e"/>
    <text x="120" y="46" fill="#24303c">User</text>
    <rect x="290" y="20" width="160" height="40" rx="8" fill="#eef4fb" stroke="#2979d6"/>
    <text x="370" y="46" fill="#1d4f8c">Gladys</text>
    <rect x="540" y="20" width="160" height="40" rx="8" fill="#f3f7ef" stroke="#4c8c2b"/>
    <text x="620" y="46" fill="#2f5d16">Integration</text>
    <rect x="775" y="20" width="200" height="40" rx="8" fill="#f6f1fd" stroke="#7a5cff"/>
    <text x="875" y="46" fill="#4a2fb0">Magic Home device</text>
  </g>
  <g stroke="#c3c9cf" stroke-width="2" stroke-dasharray="6 6">
    <line x1="120" y1="60" x2="120" y2="700"/>
    <line x1="370" y1="60" x2="370" y2="700"/>
    <line x1="620" y1="60" x2="620" y2="700"/>
    <line x1="875" y1="60" x2="875" y2="700"/>
  </g>
  <g font-size="13" fill="#24303c" stroke="#46505a" stroke-width="2">
    <line x1="120" y1="90" x2="362" y2="90" marker-end="url(#arrow)"/>
    <line x1="370" y1="125" x2="612" y2="125" marker-end="url(#arrow)"/>
    <line x1="620" y1="160" x2="378" y2="160" marker-end="url(#arrow)"/>
    <line x1="370" y1="195" x2="867" y2="195" marker-end="url(#arrow)"/>
    <line x1="875" y1="230" x2="378" y2="230" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
    <line x1="370" y1="265" x2="612" y2="265" marker-end="url(#arrow)"/>
    <line x1="620" y1="300" x2="867" y2="300" marker-end="url(#arrow)"/>
    <line x1="875" y1="335" x2="628" y2="335" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
    <line x1="620" y1="370" x2="378" y2="370" marker-end="url(#arrow)"/>
    <line x1="120" y1="405" x2="362" y2="405" marker-end="url(#arrow)"/>
    <line x1="370" y1="440" x2="612" y2="440" marker-end="url(#arrow)"/>
    <line x1="620" y1="475" x2="378" y2="475" marker-end="url(#arrow)"/>
    <line x1="120" y1="510" x2="362" y2="510" marker-end="url(#arrow)"/>
    <line x1="370" y1="545" x2="612" y2="545" marker-end="url(#arrow)"/>
    <line x1="620" y1="580" x2="867" y2="580" marker-end="url(#arrow)"/>
    <line x1="875" y1="615" x2="628" y2="615" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
    <line x1="620" y1="650" x2="378" y2="650" marker-end="url(#arrow)"/>
  </g>
  <g font-size="13" fill="#24303c">
    <text x="128" y="82">Discover tab: Scan</text>
    <text x="378" y="117">scan request</text>
    <text x="378" y="152">network scan: UDP 48899, “HF-A11ASSISTHREAD”</text>
    <text x="378" y="187">broadcast on the LAN (Gladys is on the host network)</text>
    <text x="378" y="222">ip, MAC, model of each device</text>
    <text x="378" y="257">raw answers</text>
    <text x="628" y="292">TCP 5577: state query 81 8A 8B</text>
    <text x="628" y="327">state: model 0x35, firmware 9, on</text>
    <text x="378" y="362">discovered devices (features of the model)</text>
    <text x="128" y="397">Discover tab: Add</text>
    <text x="378" y="432">device created</text>
    <text x="378" y="467">every known state</text>
    <text x="128" y="502">chooses red on the dashboard</text>
    <text x="378" y="537">setValue(color, 0xFF0000)</text>
    <text x="628" y="572">31 FF 00 00 00 00 F0 0F (+ sum)</text>
    <text x="628" y="607">pushed, or read 2.5 s later</text>
    <text x="378" y="642">states (changes only)</text>
  </g>
</svg>
